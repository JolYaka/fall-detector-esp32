; Projet : Detecteur de chute - ESP32-S3 WROOM-1 N16R8 + ADXL345

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; carte N16R8 : 16 Mo flash + 8 Mo PSRAM
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

; moniteur serie
monitor_speed = 115200
monitor_port  = COM3      ; a changer selon le port
monitor_dtr   = 0         ; sinon la carte redemarre a l'ouverture du moniteur
monitor_rts   = 0

; ADXL345
lib_deps =
    adafruit/Adafruit ADXL345 @ ^1.3.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
