; Projet : Detecteur de chute - ESP32-S3 WROOM-1 N16R8 + ADXL345

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Carte N16R8 : 16 Mo Flash + 8 Mo PSRAM Octal (OPI) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

; --- Moniteur serie (doit correspondre au Serial.begin du code) ---
monitor_speed = 115200
monitor_port  = COM3      ; a adapter selon le port de la carte
monitor_dtr   = 0         ; evite le reset de la carte a l'ouverture du moniteur
monitor_rts   = 0

; --- Bibliotheques pour l'ADXL345 ---
lib_deps =
    adafruit/Adafruit ADXL345 @ ^1.3.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
